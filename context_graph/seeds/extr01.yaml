- ref: Procedure:EXTR01/die-plug-clearing
  name: Die plug / screen block clearing
  procedure_type: troubleshooting
  status: draft
  summary: Stop feed, relieve die pressure, clear die plate and screen, restart under supervision.
- ref: Procedure:EXTR01/motor-overload-recovery
  name: Main drive overload recovery
  procedure_type: troubleshooting
  status: draft
  summary: Reduce feed rate, check torque trend and barrel temperatures, reset drive.
- ref: Procedure:EXTR01/moisture-correction
  name: Product moisture correction
  procedure_type: troubleshooting
  status: draft
  summary: Adjust steam and water injection, verify moisture sensor, confirm with lab sample.
- ref: Procedure:EXTR01/feeder-recovery
  name: Feeder starve / overload recovery
  procedure_type: troubleshooting
  status: draft
  summary: Check hopper level and feeder screw, rebalance feed rate.
- ref: Procedure:EXTR01/product-spec-correction
  name: Density / diameter correction
  procedure_type: troubleshooting
  status: draft
  summary: Adjust knife speed, moisture and die temperature; recheck density and diameter.
- ref: Procedure:EXTR01/barrel-temperature-control
  name: Barrel / head temperature control
  procedure_type: troubleshooting
  status: draft
  summary: Check heater bands and cooling, verify setpoints per zone.
- ref: Procedure:EXTR01/sensor-fault-check
  name: Sensor fault check
  procedure_type: maintenance
  status: draft
  summary: Verify wiring and calibration, swap sensor if faulty.
- ref: Procedure:EXTR01/unplanned-stop-restart
  name: Restart after unplanned stop
  procedure_type: sop
  status: draft
  summary: Identify stop cause, run warm-up sequence, restart feed gradually.
