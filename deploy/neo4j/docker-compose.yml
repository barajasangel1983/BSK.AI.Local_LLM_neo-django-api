# Dedicated Neo4j for the BSKLAB Context Graph (separate from txt2kg's Neo4j).
#
#   docker compose -f deploy/neo4j/docker-compose.yml --env-file .env up -d
#
# Credentials come from the backend .env (NEO4J_USER / NEO4J_PASSWORD).
# Bound to localhost only; Django connects via NEO4J_URI=bolt://127.0.0.1:7687.
name: bsklab

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: bsklab-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"   # browser / HTTP
      - "127.0.0.1:7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
  neo4j_logs:
